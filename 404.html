<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<script>
  /* Раньше в корне жил сайт ПолМастера. Его старые адреса (/raschet-laminata/,
     /privacy/ и т. п.) ведём на тот же путь в /polmaster-site/, остальное —
     обычная страница «не найдено». */
  (function () {
    var old = ['elochka', 'francuzskaya-elochka', 'kvarcvinil', 'otkuda-nachinat-ukladku',
               'privacy', 'raschet-laminata', 'raschet-plitki', 'img', 'style.css', 'sitemap.xml'];
    var first = location.pathname.split('/')[1];
    if (old.indexOf(first) !== -1) {
      location.replace('/polmaster-site' + location.pathname + location.search + location.hash);
    }
  })();
</script>
<style>
  :root { --bg: #f6f7f9; --text: #14171c; --muted: #5d6573; --accent: #2f6df6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --text: #eef0f4; --muted: #9aa3b2; --accent: #6b97ff; } }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    padding: 24px 16px; box-sizing: border-box;
    background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    text-align: center;
  }
  h1 { margin: 0; font-size: 56px; line-height: 1; }
  p { color: var(--muted); margin: 12px 0 24px; }
  a { display: inline-block; padding: 10px 18px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; margin: 4px; }
  a.alt { background: transparent; color: var(--accent); }
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>Такой страницы нет.</p>
    <a href="/">На главную</a>
    <a class="alt" href="/polmaster-site/">ПолМастер</a>
  </main>
</body>
</html>
